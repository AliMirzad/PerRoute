name: Platform regression

on:
  pull_request:
  push:
    branches: [feature/macos-support-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run Windows regression suites
        shell: pwsh
        run: .\gradlew.bat --no-daemon -PofficialRepositories=true runAllTests runPlatformBoundaryTests
