<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PerRoute</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="top">
      <img class="logo" src="icons/icon-48.png" alt="" />
      <div class="grow">
        <div class="brand">PerRoute</div>
        <div class="row small"><span id="status-dot" class="dot"></span><span id="status-label" class="muted">Starting…</span></div>
      </div>
      <button id="open-dashboard" class="btn ghost icon" title="Open PerRoute" aria-label="Open PerRoute">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
    </header>
    <main id="main"></main>
  </body>
</html>
